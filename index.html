<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rune Lexicon</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body {
    margin: 0;
    overflow-x: hidden;
    background-image: url('https://image.xportsnews.com/contents/images/upload/article/2024/0118/1705566127551816.jpg');
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    background-size: cover;
  }
</style>
</head>
<body style="margin:0; overflow-x: hidden;">
<div id="root" style="position: relative; z-index: 2;"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const CATEGORIES = [
  "Tên tướng",
  "Kỹ năng / Chiêu thức",
  "Vai trò / Lối chơi",
  "Trang bị / Vật phẩm",
  "Thuật ngữ trận đấu",
  "Từ vựng chung",
];

function LolDictionary() {
  const [entries, setEntries] = useState([]);
  const [query, setQuery] = useState("");
  const [filter, setFilter] = useState("");
  const [looking, setLooking] = useState(false);
  const [lookupError, setLookupError] = useState("");
  
  // Ô trắng hiển thị kết quả tra cứu gần nhất ngay dưới thanh tìm kiếm
  const [latestResult, setLatestResult] = useState(null);

  const [editingId, setEditingId] = useState(null);
  const [editDraft, setEditDraft] = useState({ pinyin: "", meaning: "", note: "", category: CATEGORIES[5] });
  const [manualOpen, setManualOpen] = useState(false);
  const [manualDraft, setManualDraft] = useState({ word: "", pinyin: "", meaning: "", note: "", category: CATEGORIES[5] });
  const [toast, setToast] = useState("");
  const [closedFolders, setClosedFolders] = useState({});

  // States Flashcard
  const [isFlashcardOpen, setIsFlashcardOpen] = useState(false);
  const [currentIndex, setCurrentIndex] = useState(0);
  const [isFlipped, setIsFlipped] = useState(false);

  useEffect(() => {
    fetchEntries();
  }, []);

  async function fetchEntries() {
    try {
      const res = await fetch('/api/lookup');
      if (res.ok) {
        const data = await res.json();
        setEntries(data);
      }
    } catch (e) {
      console.error("Lỗi khi tải từ vựng:", e);
    }
  }

  function toggleFolder(cat) {
    setClosedFolders((prev) => ({ ...prev, [cat]: !prev[cat] }));
  }

  function showToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(""), 2200);
  }

  async function handleLookup() {
    const wordClean = query.trim();
    if (!wordClean) return;
    setLookupError("");
    setLooking(true);

    try {
      const res = await fetch('/api/lookup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ word: wordClean })
      });

      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error || "Lỗi tra cứu từ vựng");
      }

      // Đưa kết quả vào ô trắng ngay dưới thanh tìm kiếm để bạn đọc nghĩa/pinyin trước
      setLatestResult(data);
      
      // Đồng thời cập nhật danh sách tổng bên dưới
      setEntries(prev => {
        const filtered = prev.filter(e => e.id !== data.id && e.word !== data.word);
        return [data, ...filtered];
      });

      setQuery("");
      showToast("Đã tra cứu thành công!");
    } catch (err) {
      setLookupError(err.message);
    } finally {
      setLooking(false);
    }
  }

  async function deleteEntry(id) {
    if (!confirm("Bạn có chắc chắn muốn xóa từ này?")) return;
    try {
      const res = await fetch('/api/lookup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'delete', id })
      });
      if (res.ok) {
        setEntries(prev => prev.filter(e => e.id !== id));
        if (latestResult && latestResult.id === id) setLatestResult(null);
        showToast("Đã xoá từ");
      }
    } catch (e) {
      showToast("Lỗi khi xóa từ");
    }
  }

  async function saveEdit(id) {
    try {
      const target = entries.find(e => e.id === id);
      const payload = {
        action: 'manual_save',
        id,
        word: target.word,
        ...editDraft
      };

      const res = await fetch('/api/lookup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        const updated = await res.json();
        setEntries(prev => prev.map(e => e.id === id ? updated : e));
        if (latestResult && latestResult.id === id) setLatestResult(updated);
        setEditingId(null);
        showToast("Đã lưu chỉnh sửa");
      }
    } catch (e) {
      showToast("Lỗi khi lưu");
    }
  }

  async function addManual() {
    const word = manualDraft.word.trim();
    if (!word) return;

    try {
      const res = await fetch('/api/lookup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'manual_save',
          ...manualDraft
        })
      });

      if (res.ok) {
        const saved = await res.json();
        setLatestResult(saved);
        setEntries(prev => [saved, ...prev.filter(e => e.word !== saved.word)]);
        setManualDraft({ word: "", pinyin: "", meaning: "", note: "", category: CATEGORIES[5] });
        setManualOpen(false);
        showToast("Đã thêm từ mới thành công");
      }
    } catch (e) {
      showToast("Lỗi khi thêm từ");
    }
  }

  function startEdit(entry) {
    setEditingId(entry.id);
    setEditDraft({ pinyin: entry.pinyin, meaning: entry.meaning, note: entry.note, category: entry.category || "Từ vựng chung" });
  }

  const filtered = entries.filter((e) => {
    const q = filter.trim().toLowerCase();
    if (!q) return true;
    return (
      e.word.toLowerCase().includes(q) ||
      e.pinyin.toLowerCase().includes(q) ||
      e.meaning.toLowerCase().includes(q) ||
      e.note.toLowerCase().includes(q)
    );
  });

  const grouped = CATEGORIES.map((cat) => ({
    category: cat,
    items: filtered.filter((e) => (e.category || "Từ vựng chung") === cat),
  })).filter((g) => g.items.length > 0);

  return (
    <div style={styles.page}>
      <header style={styles.header}>
        <div style={styles.brandRow}>
          <span style={{ fontSize: 22 }}>📖</span>
          <h1 style={styles.title}>TỪ ĐIỂN LIÊN MINH</h1>
        </div>
        <p style={styles.subtitle}>Từ điển Hán ngữ · LIÊN MINH HUYỀN THOẠI</p>
      </header>

      <section style={styles.searchCard}>
        <div style={styles.searchRow}>
          <input
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") handleLookup(); }}
            placeholder="Nhập từ tiếng Trung cần tra… ví dụ 打野"
            style={styles.searchInput}
          />
          <button
            onClick={handleLookup}
            disabled={looking || !query.trim()}
            style={{ ...styles.searchBtn, opacity: looking || !query.trim() ? 0.5 : 1 }}
          >
            {looking ? "Đang tra…" : "Tra cứu"}
          </button>
          <button
            onClick={() => { setCurrentIndex(0); setIsFlipped(false); setIsFlashcardOpen(true); }}
            style={styles.flashcardHeaderBtn}
          >
            🎓 Ôn Flashcard
          </button>
        </div>
        {lookupError && <div style={styles.errorRow}>⚠ <span style={{ color: "#d9534f", fontSize: 13 }}>{lookupError}</span></div>}
      </section>

      {/* Ô TRẮNG HIỂN THỊ KẾT QUẢ TRA CỨU NGAY LẬP TỨC */}
      {latestResult && (
        <section style={styles.latestResultCard}>
          <div style={styles.latestResultHeader}>
            <span style={styles.latestResultBadge}>✨ Từ mới tra cứu</span>
            <button onClick={() => setLatestResult(null)} style={styles.latestResultClose}>✕</button>
          </div>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: '12px', marginTop: '6px', flexWrap: 'wrap' }}>
            <span style={{ fontSize: '28px', fontWeight: '700', color: '#1a202c' }}>{latestResult.word}</span>
            <span style={{ fontSize: '15px', fontWeight: '600', color: '#3182ce' }}>{latestResult.pinyin}</span>
            <span style={{ fontSize: '12px', background: '#edf2f7', padding: '2px 8px', borderRadius: '10px', color: '#4a5568' }}>📁 {latestResult.category}</span>
          </div>
          <p style={{ fontSize: '15px', color: '#2d3748', margin: '8px 0 4px 0', fontWeight: '500' }}>{latestResult.meaning}</p>
          {latestResult.note && <p style={{ fontSize: '13px', color: '#718096', fontStyle: 'italic', margin: '4px 0 0 0' }}>Ghi chú: {latestResult.note}</p>}
        </section>
      )}

      <section style={styles.listHeader}>
        <div style={styles.listHeaderLeft}>
          <span style={styles.listCount}>📚 {entries.length} mục từ</span>
        </div>
        <div style={styles.filterRow}>
          <input
            value={filter}
            onChange={(e) => setFilter(e.target.value)}
            placeholder="Lọc trong từ điển…"
            style={styles.filterInput}
          />
          <button style={styles.addBtn} onClick={() => setManualOpen((o) => !o)}>+ Thêm từ</button>
        </div>
      </section>

      {manualOpen && (
        <section style={styles.manualCard}>
          <div style={styles.manualGrid}>
            <input placeholder="Từ (chữ Hán)" value={manualDraft.word} onChange={(e) => setManualDraft({ ...manualDraft, word: e.target.value })} style={styles.manualInput} />
            <input placeholder="Pinyin" value={manualDraft.pinyin} onChange={(e) => setManualDraft({ ...manualDraft, pinyin: e.target.value })} style={styles.manualInput} />
          </div>
          <input placeholder="Nghĩa" value={manualDraft.meaning} onChange={(e) => setManualDraft({ ...manualDraft, meaning: e.target.value })} style={{ ...styles.manualInput, width: "100%", marginTop: 8 }} />
          <textarea placeholder="Ghi chú (không bắt buộc)" value={manualDraft.note} onChange={(e) => setManualDraft({ ...manualDraft, note: e.target.value })} style={{ ...styles.manualInput, width: "100%", marginTop: 8, minHeight: 60, resize: "vertical" }} />
          <select value={manualDraft.category} onChange={(e) => setManualDraft({ ...manualDraft, category: e.target.value })} style={{ ...styles.manualInput, width: "100%", marginTop: 8 }}>
            {CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
          </select>
          <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
            <button style={styles.saveBtn} onClick={addManual} disabled={!manualDraft.word.trim()}>✓ Lưu</button>
            <button style={styles.cancelBtn} onClick={() => setManualOpen(false)}>✕ Huỷ</button>
          </div>
        </section>
      )}

      <main style={styles.list}>
        {entries.length === 0 && (
          <div style={styles.emptyState}>Chưa có từ nào trong từ điển. Hãy tra cứu một từ mới ở trên.</div>
        )}
        {entries.length > 0 && filtered.length === 0 && (
          <div style={styles.emptyState}>Không tìm thấy từ phù hợp với bộ lọc.</div>
        )}
        {grouped.map(({ category, items }) => {
          const isClosed = !!closedFolders[category];
          return (
            <div key={category} style={styles.folder}>
              <div style={styles.folderHeader} onClick={() => toggleFolder(category)}>
                <span style={styles.folderArrow}>{isClosed ? "▶" : "▼"}</span>
                <span style={styles.folderName}>📁 {category}</span>
                <span style={styles.folderCount}>{items.length}</span>
              </div>
              {!isClosed && (
                <div style={styles.folderBody}>
                  {items.map((entry) => (
                    <div key={entry.id} style={styles.card}>
                      <div style={styles.cardTop}>
                        <div>
                          <span style={styles.word}>{entry.word}</span>
                          <span style={styles.pinyin}>
                            {editingId === entry.id ? (
                              <input value={editDraft.pinyin} onChange={(e) => setEditDraft({ ...editDraft, pinyin: e.target.value })} style={styles.inlineInput} />
                            ) : entry.pinyin}
                          </span>
                        </div>
                        <div style={{ display: "flex", gap: 6 }}>
                          {editingId === entry.id ? (
                            <>
                              <button style={styles.iconBtnGood} onClick={() => saveEdit(entry.id)}>✓</button>
                              <button style={styles.iconBtn} onClick={() => setEditingId(null)}>✕</button>
                            </>
                          ) : (
                            <>
                              <button style={styles.iconBtn} onClick={() => startEdit(entry)}>✎</button>
                              <button style={styles.iconBtnBad} onClick={() => deleteEntry(entry.id)}>🗑</button>
                            </>
                          )}
                        </div>
                      </div>
                      {editingId === entry.id ? (
                        <>
                          <input value={editDraft.meaning} onChange={(e) => setEditDraft({ ...editDraft, meaning: e.target.value })} style={{ ...styles.inlineInput, width: "100%", marginTop: 8, fontSize: 14 }} placeholder="Nghĩa" />
                          <textarea value={editDraft.note} onChange={(e) => setEditDraft({ ...editDraft, note: e.target.value })} style={{ ...styles.inlineInput, width: "100%", marginTop: 6, minHeight: 50, resize: "vertical" }} placeholder="Ghi chú" />
                          <select value={editDraft.category} onChange={(e) => setEditDraft({ ...editDraft, category: e.target.value })} style={{ ...styles.inlineInput, width: "100%", marginTop: 6 }}>
                            {CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
                          </select>
                        </>
                      ) : (
                        <>
                          <p style={styles.meaning}>{entry.meaning}</p>
                          {entry.note && <p style={styles.note}>{entry.note}</p>}
                        </>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </main>

      {/* Modal Flashcard */}
      {isFlashcardOpen && (
        <div style={styles.modalOverlay}>
          <div style={styles.modalCard}>
            <h3 style={{ margin: '0 0 16px 0', color: '#2d3748' }}>🎓 Ôn tập Flashcard</h3>
            
            {entries.length === 0 ? (
              <p style={{ color: '#666' }}>Không có từ vựng để ôn tập!</p>
            ) : (
              <div>
                <div 
                  onClick={() => setIsFlipped(!isFlipped)}
                  style={styles.flashcardBox}
                >
                  {!isFlipped ? (
                    <div>
                      <span style={{ fontSize: '11.5px', textTransform: 'uppercase', color: '#718096', letterSpacing: '1px' }}>Từ vựng</span>
                      <h2 style={{ margin: '8px 0 0 0', color: '#1a202c', fontSize: '30px' }}>{entries[currentIndex].word}</h2>
                      <span style={{ fontSize: '12.5px', color: '#a0aec0', marginTop: '12px', display: 'block' }}>(Bấm vào thẻ để lật xem nghĩa)</span>
                    </div>
                  ) : (
                    <div>
                      <span style={{ fontSize: '11.5px', textTransform: 'uppercase', color: '#3182ce', letterSpacing: '1px' }}>Phiên âm & Nghĩa</span>
                      <p style={{ fontSize: '19px', fontWeight: 'bold', color: '#2b6cb0', margin: '6px 0' }}>{entries[currentIndex].pinyin}</p>
                      <p style={{ fontSize: '16px', color: '#2d3748', margin: '6px 0' }}>{entries[currentIndex].meaning}</p>
                      {entries[currentIndex].note && (
                        <p style={{ fontSize: '12.5px', color: '#e53e3e', fontStyle: 'italic', margin: '8px 0 0 0' }}>
                          Ghi chú: {entries[currentIndex].note}
                        </p>
                      )}
                    </div>
                  )}
                </div>

                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
                  <button 
                    onClick={() => { setIsFlipped(false); setCurrentIndex((prev) => (prev > 0 ? prev - 1 : entries.length - 1)); }}
                    style={styles.modalNavBtn}
                  >
                    ⬅ Trước
                  </button>
                  <span style={{ fontSize: '13.5px', color: '#4a5568', fontWeight: '600' }}>
                    {currentIndex + 1} / {entries.length}
                  </span>
                  <button 
                    onClick={() => { setIsFlipped(false); setCurrentIndex((prev) => (prev < entries.length - 1 ? prev + 1 : 0)); }}
                    style={styles.modalNavBtn}
                  >
                    Sau ➡
                  </button>
                </div>
              </div>
            )}

            <button 
              onClick={() => setIsFlashcardOpen(false)}
              style={styles.modalCloseBtn}
            >
              Đóng ôn tập
            </button>
          </div>
        </div>
      )}

      {toast && <div style={styles.toast}>{toast}</div>}
    </div>
  );
}

const styles = {
  page: { minHeight: "100vh", color: "#2d3748", fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif", padding: "28px 16px 60px", position: "relative" },
  header: { maxWidth: 640, margin: "0 auto 22px", textAlign: "center", position: "relative" },
  brandRow: { display: "flex", alignItems: "center", justifyContent: "center", gap: 8 },
  title: { 
    fontSize: 26, 
    fontWeight: 800, 
    letterSpacing: 1.2, 
    margin: 0, 
    textTransform: 'uppercase',
    background: 'linear-gradient(135deg, #BF953F 0%, #FCF6BA 25%, #B38728 50%, #FBF5B7 75%, #AA771C 100%)',
    WebkitBackgroundClip: 'text',
    WebkitTextFillColor: 'transparent',
    filter: 'drop-shadow(0px 2px 3px rgba(0,0,0,0.6))',
  },
  subtitle: { 
    fontSize: 13, 
    fontWeight: 800, 
    letterSpacing: 0.8, 
    marginTop: 6, 
    textTransform: 'uppercase',
    background: 'linear-gradient(135deg, #BF953F 0%, #FCF6BA 25%, #B38728 50%, #FBF5B7 75%, #AA771C 100%)',
    WebkitBackgroundClip: 'text',
    WebkitTextFillColor: 'transparent',
    filter: 'drop-shadow(0px 1px 2px rgba(0,0,0,0.6))',
  },
  searchCard: { maxWidth: 640, margin: "0 auto 18px", background: "rgba(255, 255, 255, 0.9)", backdropFilter: "blur(8px)", border: "1px solid rgba(255,255,255,0.6)", borderRadius: 8, padding: 14, boxShadow: "0 4px 20px rgba(0, 0, 0, 0.08)" },
  searchRow: { display: "flex", gap: 8, flexWrap: "wrap" },
  searchInput: { flex: 1, minWidth: 160, background: "#fff", border: "1px solid #cbd5e0", borderRadius: 4, padding: "11px 12px", color: "#2d3748", fontSize: 15, fontFamily: "inherit", outline: "none" },
  searchBtn: { display: "flex", alignItems: "center", gap: 6, background: "#3182ce", color: "#fff", border: "none", borderRadius: 4, padding: "0 16px", fontWeight: 700, fontSize: 13.5, cursor: "pointer", boxShadow: "0 2px 8px rgba(49, 130, 206, 0.3)" },
  flashcardHeaderBtn: { display: "flex", alignItems: "center", gap: 6, background: "#38a169", color: "#fff", border: "none", borderRadius: 4, padding: "0 16px", fontWeight: 700, fontSize: 13.5, cursor: "pointer", boxShadow: "0 2px 8px rgba(56, 161, 105, 0.3)" },
  errorRow: { display: "flex", alignItems: "center", gap: 6, marginTop: 8 },
  
  latestResultCard: { maxWidth: 640, margin: "0 auto 18px", background: "rgba(255, 255, 255, 0.95)", backdropFilter: "blur(8px)", border: "2px solid #3182ce", borderRadius: 8, padding: "16px 18px", boxShadow: "0 4px 20px rgba(49, 130, 206, 0.15)" },
  latestResultHeader: { display: "flex", justifyContent: "space-between", alignItems: "center" },
  latestResultBadge: { fontSize: "11.5px", textTransform: "uppercase", fontWeight: "700", color: "#3182ce", letterSpacing: "0.5px" },
  latestResultClose: { background: "transparent", border: "none", fontSize: "15px", color: "#718096", cursor: "pointer", fontWeight: "bold" },

  listHeader: { maxWidth: 640, margin: "0 auto 10px", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 },
  listHeaderLeft: { display: "flex", alignItems: "center", gap: 6 },
  listCount: { fontSize: 12.5, color: "#2d3748", fontWeight: 600, letterSpacing: 0.3, textShadow: "0 1px 2px rgba(255,255,255,0.8)" },
  filterRow: { display: "flex", gap: 8 },
  filterInput: { background: "rgba(255,255,255,0.9)", border: "1px solid #cbd5e0", borderRadius: 4, padding: "7px 10px", color: "#2d3748", fontSize: 13, fontFamily: "inherit", outline: "none", width: 160 },
  addBtn: { display: "flex", alignItems: "center", gap: 5, background: "rgba(255,255,255,0.9)", border: "1px solid #cbd5e0", color: "#2b6cb0", borderRadius: 4, padding: "7px 12px", fontSize: 12.5, fontWeight: 600, cursor: "pointer" },
  manualCard: { maxWidth: 640, margin: "0 auto 16px", background: "rgba(255, 255, 255, 0.95)", border: "1px solid #cbd5e0", borderRadius: 8, padding: 14, boxShadow: "0 4px 15px rgba(0, 0, 0, 0.1)" },
  manualGrid: { display: "flex", gap: 8 },
  manualInput: { flex: 1, background: "#fff", border: "1px solid #cbd5e0", borderRadius: 4, padding: "9px 10px", color: "#2d3748", fontSize: 13.5, fontFamily: "inherit", outline: "none" },
  saveBtn: { display: "flex", alignItems: "center", gap: 5, background: "#3182ce", color: "#fff", border: "none", borderRadius: 4, padding: "7px 14px", fontWeight: 700, fontSize: 12.5, cursor: "pointer" },
  cancelBtn: { display: "flex", alignItems: "center", gap: 5, background: "transparent", color: "#4a5568", border: "1px solid #cbd5e0", borderRadius: 4, padding: "7px 14px", fontSize: 12.5, cursor: "pointer" },
  list: { maxWidth: 640, margin: "0 auto", display: "flex", flexDirection: "column", gap: 14 },
  folder: { border: "1px solid rgba(255,255,255,0.6)", borderRadius: 8, overflow: "hidden", background: "rgba(255, 255, 255, 0.8)", backdropFilter: "blur(5px)" },
  folderHeader: { display: "flex", alignItems: "center", gap: 8, background: "rgba(255, 255, 255, 0.9)", padding: "10px 12px", cursor: "pointer", userSelect: "none" },
  folderArrow: { fontSize: 10, color: "#3182ce" },
  folderName: { fontSize: 14, fontWeight: 700, color: "#2b6cb0", flex: 1 },
