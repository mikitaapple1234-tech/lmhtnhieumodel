<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rune Lexicon</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;">
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const STORAGE_KEY = "lol-hanzi-entries";
const CATEGORIES = [
  "Tên tướng",
  "Kỹ năng / Chiêu thức",
  "Vai trò / Lối chơi",
  "Trang bị / Vật phẩm",
  "Thuật ngữ trận đấu",
  "Từ vựng chung",
];

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function LolDictionary() {
  const [entries, setEntries] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [loadError, setLoadError] = useState(false);
  const [query, setQuery] = useState("");
  const [filter, setFilter] = useState("");
  const [looking, setLooking] = useState(false);
  const [lookupError, setLookupError] = useState("");
  const [searchResult, setSearchResult] = useState(null); // Từ vừa tìm kiếm hiển thị ở khung trắng
  const [editingId, setEditingId] = useState(null);
  const [editDraft, setEditDraft] = useState({ pinyin: "", meaning: "", note: "", category: CATEGORIES[CATEGORIES.length - 1] });
  const [manualOpen, setManualOpen] = useState(false);
  const [manualDraft, setManualDraft] = useState({ word: "", pinyin: "", meaning: "", note: "", category: CATEGORIES[CATEGORIES.length - 1] });
  const [toast, setToast] = useState("");
  const [closedFolders, setClosedFolders] = useState({});

  // Navigation & Flashcard States
  const [activeTab, setActiveTab] = useState("dictionary"); // "dictionary" | "flashcard"
  const [fcCategory, setFcCategory] = useState("Tất cả");
  const [fcIndex, setFcIndex] = useState(0);
  const [fcFlipped, setFcFlipped] = useState(false);

  function toggleFolder(cat) {
    setClosedFolders((prev) => ({ ...prev, [cat]: !prev[cat] }));
  }

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        setEntries(parsed.map((e) => ({ ...e, category: e.category || "Từ vựng chung" })));
      }
    } catch (e) {}
    setLoaded(true);
  }, []);

  function persist(next) {
    setEntries(next);
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
    } catch (e) {
      setLoadError(true);
    }
  }

  function showToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(""), 2200);
  }

  async function handleLookup() {
    const word = query.trim();
    if (!word) return;
    setLookupError("");
    setLooking(true);
    try {
      const response = await fetch("/api/lookup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ word }),
      });
      const parsed = await response.json();
      if (!response.ok) throw new Error(parsed.error || "API lỗi");

      const existingIdx = entries.findIndex((e) => e.word === word);
      const newEntry = {
        id: existingIdx >= 0 ? entries[existingIdx].id : uid(),
        word,
        pinyin: parsed.pinyin || "",
        meaning: parsed.meaning || "",
        note: parsed.note || "",
        category: parsed.category || "Từ vựng chung",
        createdAt: existingIdx >= 0 ? entries[existingIdx].createdAt : Date.now(),
      };

      let next;
      if (existingIdx >= 0) {
        next = [...entries];
        next[existingIdx] = newEntry;
      } else {
        next = [newEntry, ...entries];
      }

      // 1. Tự động thêm từ đó vào thư mục / bộ nhớ LocalStorage
      persist(next);

      // 2. Hiển thị từ vừa tìm kiếm vào KHUNG TRẮNG
      setSearchResult(newEntry);

      // 3. Tự động mở thư mục tương ứng ở bên dưới
      if (newEntry.category) {
        setClosedFolders((prev) => ({ ...prev, [newEntry.category]: false }));
      }

      showToast(existingIdx >= 0 ? "Đã cập nhật từ vào thư mục!" : "Đã tự động thêm vào thư mục!");
    } catch (e) {
      setLookupError(e.message || "Không tra cứu được từ này. Thử lại nhé.");
    } finally {
      setLooking(false);
    }
  }

  function startEdit(entry) {
    setEditingId(entry.id);
    setEditDraft({ pinyin: entry.pinyin, meaning: entry.meaning, note: entry.note, category: entry.category || "Từ vựng chung" });
  }

  function saveEdit(id) {
    const next = entries.map((e) => (e.id === id ? { ...e, ...editDraft } : e));
    persist(next);
    if (searchResult && searchResult.id === id) {
      setSearchResult((prev) => ({ ...prev, ...editDraft }));
    }
    setEditingId(null);
    showToast("Đã lưu chỉnh sửa");
  }

  function deleteEntry(id) {
    const next = entries.filter((e) => e.id !== id);
    persist(next);
    if (searchResult && searchResult.id === id) {
      setSearchResult(null);
    }
    showToast("Đã xoá từ");
  }

  function addManual() {
    const word = manualDraft.word.trim();
    if (!word) return;
    const existingIdx = entries.findIndex((e) => e.word === word);
    const entry = {
      id: existingIdx >= 0 ? entries[existingIdx].id : uid(),
      word,
      pinyin: manualDraft.pinyin.trim(),
      meaning: manualDraft.meaning.trim(),
      note: manualDraft.note.trim(),
      category: manualDraft.category || "Từ vựng chung",
      createdAt: existingIdx >= 0 ? entries[existingIdx].createdAt : Date.now(),
    };
    let next;
    if (existingIdx >= 0) {
      next = [...entries];
      next[existingIdx] = entry;
    } else {
      next = [entry, ...entries];
    }
    persist(next);
    setSearchResult(entry);
    if (entry.category) {
      setClosedFolders((prev) => ({ ...prev, [entry.category]: false }));
    }
    setManualDraft({ word: "", pinyin: "", meaning: "", note: "", category: CATEGORIES[CATEGORIES.length - 1] });
    setManualOpen(false);
    showToast("Đã thêm & tự động lưu từ mới");
  }

  // Lọc danh sách từ
  const filtered = entries.filter((e) => {
    const q = filter.trim().toLowerCase();
    if (!q) return true;
    return (
      e.word.toLowerCase().includes(q) ||
      e.pinyin.toLowerCase().includes(q) ||
      e.meaning.toLowerCase().includes(q) ||
      e.note.toLowerCase().includes(q)
    );
  });

  const grouped = CATEGORIES.map((cat) => ({
    category: cat,
    items: filtered.filter((e) => (e.category || "Từ vựng chung") === cat),
  })).filter((g) => g.items.length > 0);

  // Danh sách cho Flashcard
  const fcPool = fcCategory === "Tất cả"
    ? entries
    : entries.filter((e) => (e.category || "Từ vựng chung") === fcCategory);

  const safeFcIndex = fcPool.length > 0 ? Math.min(fcIndex, fcPool.length - 1) : 0;
  const currentFc = fcPool[safeFcIndex] || null;

  function nextFc() {
    if (fcPool.length === 0) return;
    setFcFlipped(false);
    setFcIndex((prev) => (prev + 1) % fcPool.length);
  }

  function prevFc() {
    if (fcPool.length === 0) return;
    setFcFlipped(false);
    setFcIndex((prev) => (prev - 1 + fcPool.length) % fcPool.length);
  }

  function shuffleFc() {
    if (fcPool.length <= 1) return;
    setFcFlipped(false);
    const rand = Math.floor(Math.random() * fcPool.length);
    setFcIndex(rand);
  }

  return (
    <div style={styles.page}>
      <div style={styles.bgRunes} />
      
      {/* Header */}
      <header style={styles.header}>
        <div style={styles.brandRow}>
          <span style={{ fontSize: 22 }}>⚔️</span>
          <h1 style={styles.title}>Rune Lexicon</h1>
        </div>
        <p style={styles.subtitle}>Từ điển Hán ngữ · thuật ngữ Liên Minh Huyền Thoại</p>
        
        {/* Tab chuyển đổi giữa Từ điển & Flashcard */}
        <div style={styles.tabContainer}>
          <button
            style={{ ...styles.tabBtn, ...(activeTab === "dictionary" ? styles.tabActive : {}) }}
            onClick={() => setActiveTab("dictionary")}
          >
            📖 Từ điển ({entries.length})
          </button>
          <button
            style={{ ...styles.tabBtn, ...(activeTab === "flashcard" ? styles.tabActive : {}) }}
            onClick={() => {
              setActiveTab("flashcard");
              setFcIndex(0);
              setFcFlipped(false);
            }}
          >
            🎴 Thẻ ghi nhớ (Flashcards)
          </button>
        </div>
      </header>

      {/* CHẾ ĐỘ 1: TÌM KIẾM VÀ TỪ ĐIỂN */}
      {activeTab === "dictionary" && (
        <>
          {/* KHU VỰC TÌM KIẾM */}
          <section style={styles.searchCard}>
            <div style={styles.searchRow}>
              <input
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter") handleLookup(); }}
                placeholder="Nhập từ tiếng Trung cần tra… ví dụ 打野"
                style={styles.searchInput}
              />
              <button
                onClick={handleLookup}
                disabled={looking || !query.trim()}
                style={{ ...styles.searchBtn, opacity: looking || !query.trim() ? 0.5 : 1 }}
              >
                {looking ? "Đang tra…" : "Tra cứu"}
              </button>
            </div>
            {lookupError && <div style={styles.errorRow}>⚠ <span style={{ color: "#E84057", fontSize: 13 }}>{lookupError}</span></div>}

            {/* KHUNG TRẮNG HIỂN THỊ TỪ VỪA TÌM KIẾM */}
            {searchResult && (
              <div style={styles.whiteResultBox}>
                <div style={styles.whiteResultHeader}>
                  <span style={styles.whiteResultTitle}>📌 TỪ VỪA TÌM KIẾM</span>
                  <button style={styles.whiteCloseBtn} onClick={() => setSearchResult(null)} title="Đóng khung">✕</button>
                </div>
                
                <div style={styles.whiteResultBody}>
                  <div style={styles.whiteWordRow}>
                    <span style={styles.whiteWord}>{searchResult.word}</span>
                    <span style={styles.whitePinyin}>{searchResult.pinyin}</span>
                    <span style={styles.whiteCategoryBadge}>📁 {searchResult.category}</span>
                  </div>

                  <div style={styles.whiteMeaning}>
                    <strong>Nghĩa:</strong> {searchResult.meaning}
                  </div>

                  {searchResult.note && (
                    <div style={styles.whiteNote}>
                      <strong>Ghi chú:</strong> {searchResult.note}
                    </div>
                  )}

                  {/* BÁO TỰ ĐỘNG LƯU VÀO THƯ MỤC */}
                  <div style={styles.autoSaveBadge}>
                    ✓ Đã tự động thêm từ này vào thư mục <strong>"{searchResult.category}"</strong>
                  </div>
                </div>
              </div>
            )}
          </section>

          {/* Header danh sách các thư mục */}
          <section style={styles.listHeader}>
            <div style={styles.listHeaderLeft}>
              <span style={styles.listCount}>📖 {entries.length} mục từ đã được lưu</span>
            </div>
            <div style={styles.filterRow}>
              <input
                value={filter}
                onChange={(e) => setFilter(e.target.value)}
                placeholder="Lọc từ vựng…"
                style={styles.filterInput}
              />
              <button style={styles.addBtn} onClick={() => setManualOpen((o) => !o)}>+ Thêm từ</button>
            </div>
          </section>

          {/* Form thêm từ thủ công */}
          {manualOpen && (
            <section style={styles.manualCard}>
              <div style={styles.manualGrid}>
                <input placeholder="Từ (chữ Hán)" value={manualDraft.word} onChange={(e) => setManualDraft({ ...manualDraft, word: e.target.value })} style={styles.manualInput} />
                <input placeholder="Pinyin" value={manualDraft.pinyin} onChange={(e) => setManualDraft({ ...manualDraft, pinyin: e.target.value })} style={styles.manualInput} />
              </div>
              <input placeholder="Nghĩa" value={manualDraft.meaning} onChange={(e) => setManualDraft({ ...manualDraft, meaning: e.target.value })} style={{ ...styles.manualInput, width: "100%", marginTop: 8 }} />
              <textarea placeholder="Ghi chú (không bắt buộc)" value={manualDraft.note} onChange={(e) => setManualDraft({ ...manualDraft, note: e.target.value })} style={{ ...styles.manualInput, width: "100%", marginTop: 8, minHeight: 60, resize: "vertical" }} />
              <select value={manualDraft.category} onChange={(e) => setManualDraft({ ...manualDraft, category: e.target.value })} style={{ ...styles.manualInput, width: "100%", marginTop: 8 }}>
                {CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
              </select>
              <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                <button style={styles.saveBtn} onClick={addManual} disabled={!manualDraft.word.trim()}>✓ Lưu</button>
                <button style={styles.cancelBtn} onClick={() => setManualOpen(false)}>✕ Huỷ</button>
              </div>
            </section>
          )}

          {/* Danh sách các Thư mục từ vựng đã tự động thêm */}
          <main style={styles.list}>
            {!loaded && <div style={styles.emptyState}>Đang tải từ điển…</div>}
            {loaded && entries.length === 0 && (
              <div style={styles.emptyState}>
                Chưa có từ nào. Tra một thuật ngữ LMHT như <span style={{ color: "#C89B3C" }}>打野</span> (đi rừng) để bắt đầu.
              </div>
            )}
            {loaded && entries.length > 0 && filtered.length === 0 && (
              <div style={styles.emptyState}>Không tìm thấy từ phù hợp với bộ lọc.</div>
            )}
            {grouped.map(({ category, items }) => {
              const isClosed = !!closedFolders[category];
              return (
                <div key={category} style={styles.folder}>
                  <div style={styles.folderHeader} onClick={() => toggleFolder(category)}>
                    <span style={styles.folderArrow}>{isClosed ? "▶" : "▼"}</span>
                    <span style={styles.folderName}>📁 {category}</span>
                    <span style={styles.folderCount}>{items.length}</span>
                  </div>
                  {!isClosed && (
                    <div style={styles.folderBody}>
                      {items.map((entry) => (
                        <div key={entry.id} style={styles.card}>
                          <div style={styles.cardTop}>
                            <div>
                              <span style={styles.word}>{entry.word}</span>
                              <span style={styles.pinyin}>
                                {editingId === entry.id ? (
                                  <input value={editDraft.pinyin} onChange={(e) => setEditDraft({ ...editDraft, pinyin: e.target.value })} style={styles.inlineInput} />
                                ) : entry.pinyin}
                              </span>
                            </div>
                            <div style={{ display: "flex", gap: 6 }}>
                              {editingId === entry.id ? (
                                <>
                                  <button style={styles.iconBtnGood} onClick={() => saveEdit(entry.id)}>✓</button>
                                  <button style={styles.iconBtn} onClick={() => setEditingId(null)}>✕</button>
                                </>
                              ) : (
                                <>
                                  <button style={styles.iconBtn} onClick={() => startEdit(entry)}>✎</button>
                                  <button style={styles.iconBtnBad} onClick={() => deleteEntry(entry.id)}>🗑</button>
                                </>
                              )}
                            </div>
                          </div>
                          {editingId === entry.id ? (
                            <>
                              <input value={editDraft.meaning} onChange={(e) => setEditDraft({ ...editDraft, meaning: e.target.value })} style={{ ...styles.inlineInput, width: "100%", marginTop: 8, fontSize: 14 }} placeholder="Nghĩa" />
                              <textarea value={editDraft.note} onChange={(e) => setEditDraft({ ...editDraft, note: e.target.value })} style={{ ...styles.inlineInput, width: "100%", marginTop: 6, minHeight: 50, resize: "vertical" }} placeholder="Ghi chú" />
                              <select value={editDraft.category} onChange={(e) => setEditDraft({ ...editDraft, category: e.target.value })} style={{ ...styles.inlineInput, width: "100%", marginTop: 6 }}>
                                {CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
                              </select>
                            </>
                          ) : (
                            <>
                              <p style={styles.meaning}>{entry.meaning}</p>
                              {entry.note && <p style={styles.note}>{entry.note}</p>}
                            </>
                          )}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </main>
        </>
      )}

      {/* CHẾ ĐỘ 2: FLASHCARDS (THẺ GHI NHỚ) */}
      {activeTab === "flashcard" && (
        <section style={styles.flashcardContainer}>
          <div style={styles.fcControlsTop}>
            <div style={styles.fcFilterGroup}>
              <label style={styles.fcLabel}>Thư mục ôn tập:</label>
              <select
                value={fcCategory}
                onChange={(e) => {
                  setFcCategory(e.target.value);
                  setFcIndex(0);
                  setFcFlipped(false);
                }}
                style={styles.fcSelect}
              >
                <option value="Tất cả">Tất cả từ vựng ({entries.length})</option>
                {CATEGORIES.map((c) => {
                  const count = entries.filter((e) => (e.category || "Từ vựng chung") === c).length;
                  return <option key={c} value={c}>{c} ({count})</option>;
                })}
              </select>
            </div>
            
            <button style={styles.fcShuffleBtn} onClick={shuffleFc} disabled={fcPool.length <= 1}>
              🔀 Tráo ngẫu nhiên
            </button>
          </div>

          {fcPool.length === 0 ? (
            <div style={styles.emptyState}>
              Không có từ vựng nào trong thư mục này để ôn tập.
              <br />Hãy quay lại tab <strong>Từ điển</strong> để tra từ mới nhé!
            </div>
          ) : (
            <>
              <div
                style={{
                  ...styles.fcCard,
                  borderColor: fcFlipped ? "#0AC8B9" : "#C89B3C",
                  boxShadow: fcFlipped ? "0 0 20px rgba(10,200,185,0.2)" : "0 0 20px rgba(200,155,60,0.15)",
                }}
                onClick={() => setFcFlipped((f) => !f)}
              >
                <div style={styles.fcCardCategory}>📁 {currentFc.category || "Từ vựng chung"}</div>
                
                <div style={styles.fcCardMain}>
                  <div style={styles.fcWord}>{currentFc.word}</div>
                  
                  {fcFlipped ? (
                    <div style={styles.fcFlippedContent}>
                      <div style={styles.fcPinyin}>{currentFc.pinyin}</div>
                      <div style={styles.fcMeaning}>{currentFc.meaning}</div>
                      {currentFc.note && <div style={styles.fcNote}>💡 {currentFc.note}</div>}
                    </div>
                  ) : (
                    <div style={styles.fcHint}>👆 Nhấp hoặc bấm "Lật thẻ" để xem nghĩa</div>
                  )}
                </div>

                <div style={styles.fcProgress}>
                  Thẻ {safeFcIndex + 1} / {fcPool.length}
                </div>
              </div>

              <div style={styles.fcControlsBottom}>
                <button style={styles.fcNavBtn} onClick={prevFc}>⏮ Trước</button>
                <button style={styles.fcFlipBtn} onClick={() => setFcFlipped((f) => !f)}>
                  🔄 {fcFlipped ? "Ẩn đáp án" : "Lật xem nghĩa"}
                </button>
                <button style={styles.fcNavBtn} onClick={nextFc}>Tiếp ⏭</button>
              </div>
            </>
          )}
        </section>
      )}

      {toast && <div style={styles.toast}>{toast}</div>}
      {loadError && <div style={styles.toastError}>Có sự cố khi lưu — dữ liệu có thể chưa được cập nhật.</div>}
    </div>
  );
}

const styles = {
  page: { minHeight: "100vh", background: "linear-gradient(180deg, #0A1428 0%, #0F1B33 60%, #0A1428 100%)", color: "#F0E6D2", fontFamily: "Georgia, 'Noto Serif SC', serif", padding: "28px 16px 60px", position: "relative", overflow: "hidden" },
  bgRunes: { position: "absolute", inset: 0, backgroundImage: "radial-gradient(circle at 15% 20%, rgba(200,155,60,0.06) 0%, transparent 35%), radial-gradient(circle at 85% 80%, rgba(10,200,185,0.06) 0%, transparent 35%)", pointerEvents: "none" },
  header: { maxWidth: 640, margin: "0 auto 22px", textAlign: "center", position: "relative" },
  brandRow: { display: "flex", alignItems: "center", justifyContent: "center", gap: 8 },
  title: { fontSize: 26, fontWeight: 700, letterSpacing: 1, margin: 0, color: "#F0E6D2", textShadow: "0 0 18px rgba(200,155,60,0.25)" },
  subtitle: { fontFamily: "Arial, sans-serif", fontSize: 12.5, color: "#8C9AA6", marginTop: 6, letterSpacing: 0.4 },
  
  /* Tabs Navigation */
  tabContainer: { display: "flex", justifyContent: "center", gap: 10, marginTop: 16 },
  tabBtn: { background: "rgba(20,32,54,0.8)", border: "1px solid #2A3A4C", color: "#8C9AA6", padding: "8px 16px", borderRadius: 20, fontSize: 13, fontFamily: "Arial, sans-serif", fontWeight: 600, cursor: "pointer", transition: "all 0.2s" },
  tabActive: { background: "rgba(200,155,60,0.15)", border: "1px solid #C89B3C", color: "#F0E6D2", boxShadow: "0 0 12px rgba(200,155,60,0.2)" },

  searchCard: { maxWidth: 640, margin: "0 auto 16px", background: "rgba(20,32,54,0.85)", border: "1px solid #3A4A5C", borderRadius: 4, padding: 14, boxShadow: "0 4px 16px rgba(0,0,0,0.3)" },
  searchRow: { display: "flex", gap: 8 },
  searchInput: { flex: 1, background: "#0F1B2E", border: "1px solid #3A4A5C", borderRadius: 3, padding: "11px 12px", color: "#F0E6D2", fontSize: 15, fontFamily: "inherit", outline: "none" },
  searchBtn: { display: "flex", alignItems: "center", gap: 6, background: "linear-gradient(180deg, #C89B3C, #A9791F)", color: "#0A1428", border: "none", borderRadius: 3, padding: "0 16px", fontWeight: 700, fontSize: 13.5, fontFamily: "Arial, sans-serif", cursor: "pointer" },
  errorRow: { display: "flex", alignItems: "center", gap: 6, marginTop: 8 },
  
  /* KHUNG TRẮNG KẾT QUẢ TÌM KIẾM (#FFFFFF) */
  whiteResultBox: { marginTop: 14, background: "#FFFFFF", color: "#0A1428", borderRadius: 6, padding: 16, border: "2px solid #C89B3C", boxShadow: "0 6px 20px rgba(0,0,0,0.4)" },
