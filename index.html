<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rune Lexicon - Hoa Anh Đào</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  /* Hiệu ứng hoa anh đào rơi */
  @keyframes fall {
    0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(105vh) translateX(50px) rotate(360deg); opacity: 0.2; }
  }
  .petal {
    position: fixed;
    top: -10vh;
    background: linear-gradient(135deg, #ffb7c5 0%, #ffc0cb 100%);
    border-radius: 150% 0 150% 0;
    pointer-events: none;
    z-index: 1;
    animation: fall linear infinite;
  }
</style>
</head>
<body style="margin:0; overflow-x: hidden;">
<!-- Các cánh hoa anh đào bay -->
<div id="sakura-container"></div>
<div id="root" style="position: relative; z-index: 2;"></div>

<script>
  // Tạo ngẫu nhiên cánh hoa rơi
  const container = document.getElementById('sakura-container');
  const petalCount = 20;
  for (let i = 0; i < petalCount; i++) {
    const petal = document.createElement('div');
    petal.className = 'petal';
    const size = Math.random() * 8 + 8; // Kích thước từ 8px đến 16px
    petal.style.width = `${size}px`;
    petal.style.height = `${size * 1.2}px`;
    petal.style.left = `${Math.random() * 100}vw`;
    petal.style.animationDuration = `${Math.random() * 5 + 5}secs`; // Tốc độ rơi từ 5 đến 10 giây
    petal.style.animationDelay = `${Math.random() * 5}s`;
    petal.style.opacity = Math.random() * 0.7 + 0.3;
    container.appendChild(petal);
  }
</script>

<script type="text/babel">
const { useState, useEffect } = React;

const STORAGE_KEY = "lol-hanzi-entries";
const CATEGORIES = [
  "Tên tướng",
  "Kỹ năng / Chiêu thức",
  "Vai trò / Lối chơi",
  "Trang bị / Vật phẩm",
  "Thuật ngữ trận đấu",
  "Từ vựng chung",
];

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function LolDictionary() {
  const [entries, setEntries] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [loadError, setLoadError] = useState(false);
  const [query, setQuery] = useState("");
  const [filter, setFilter] = useState("");
  const [looking, setLooking] = useState(false);
  const [lookupError, setLookupError] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [editDraft, setEditDraft] = useState({ pinyin: "", meaning: "", note: "", category: CATEGORIES[CATEGORIES.length - 1] });
  const [manualOpen, setManualOpen] = useState(false);
  const [manualDraft, setManualDraft] = useState({ word: "", pinyin: "", meaning: "", note: "", category: CATEGORIES[CATEGORIES.length - 1] });
  const [toast, setToast] = useState("");
  const [closedFolders, setClosedFolders] = useState({});

  function toggleFolder(cat) {
    setClosedFolders((prev) => ({ ...prev, [cat]: !prev[cat] }));
  }

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        setEntries(parsed.map((e) => ({ ...e, category: e.category || "Từ vựng chung" })));
      }
    } catch (e) {}
    setLoaded(true);
  }, []);

  function persist(next) {
    setEntries(next);
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
    } catch (e) {
      setLoadError(true);
    }
  }

  function showToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(""), 2200);
  }

  async function handleLookup() {
    const word = query.trim();
    if (!word) return;
    setLookupError("");
    setLooking(true);
    try {
      const response = await fetch("/api/lookup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ word }),
      });
      const parsed = await response.json();
      if (!response.ok) throw new Error(parsed.error || "API lỗi");

      const existingIdx = entries.findIndex((e) => e.word === word);
      const newEntry = {
        id: existingIdx >= 0 ? entries[existingIdx].id : uid(),
        word,
        pinyin: parsed.pinyin || "",
        meaning: parsed.meaning || "",
        note: parsed.note || "",
        category: parsed.category || "Từ vựng chung",
        createdAt: existingIdx >= 0 ? entries[existingIdx].createdAt : Date.now(),
      };
      let next;
      if (existingIdx >= 0) {
        next = [...entries];
        next[existingIdx] = newEntry;
      } else {
        next = [newEntry, ...entries];
      }
      persist(next);
      setQuery("");
      showToast(existingIdx >= 0 ? "Đã cập nhật lại từ đã có" : "Đã lưu vào từ điển");
    } catch (e) {
      setLookupError(e.message || "Không tra cứu được từ này. Thử lại nhé.");
    } finally {
      setLooking(false);
    }
  }

  function startEdit(entry) {
    setEditingId(entry.id);
    setEditDraft({ pinyin: entry.pinyin, meaning: entry.meaning, note: entry.note, category: entry.category || "Từ vựng chung" });
  }

  function saveEdit(id) {
    const next = entries.map((e) => (e.id === id ? { ...e, ...editDraft } : e));
    persist(next);
    setEditingId(null);
    showToast("Đã lưu chỉnh sửa");
  }

  function deleteEntry(id) {
    const next = entries.filter((e) => e.id !== id);
    persist(next);
    showToast("Đã xoá từ");
  }

  function addManual() {
    const word = manualDraft.word.trim();
    if (!word) return;
    const existingIdx = entries.findIndex((e) => e.word === word);
    const entry = {
      id: existingIdx >= 0 ? entries[existingIdx].id : uid(),
      word,
      pinyin: manualDraft.pinyin.trim(),
      meaning: manualDraft.meaning.trim(),
      note: manualDraft.note.trim(),
      category: manualDraft.category || "Từ vựng chung",
      createdAt: existingIdx >= 0 ? entries[existingIdx].createdAt : Date.now(),
    };
    let next;
    if (existingIdx >= 0) {
      next = [...entries];
      next[existingIdx] = entry;
    } else {
      next = [entry, ...entries];
    }
    persist(next);
    setManualDraft({ word: "", pinyin: "", meaning: "", note: "", category: CATEGORIES[CATEGORIES.length - 1] });
    setManualOpen(false);
    showToast("Đã thêm từ mới");
  }

  const filtered = entries.filter((e) => {
    const q = filter.trim().toLowerCase();
    if (!q) return true;
    return (
      e.word.toLowerCase().includes(q) ||
      e.pinyin.toLowerCase().includes(q) ||
      e.meaning.toLowerCase().includes(q) ||
      e.note.toLowerCase().includes(q)
    );
  });

  const grouped = CATEGORIES.map((cat) => ({
    category: cat,
    items: filtered.filter((e) => (e.category || "Từ vựng chung") === cat),
  })).filter((g) => g.items.length > 0);

  return (
    <div style={styles.page}>
      <header style={styles.header}>
        <div style={styles.brandRow}>
          <span style={{ fontSize: 22 }}>🌸</span>
          <h1 style={styles.title}>Rune Lexicon</h1>
        </div>
        <p style={styles.subtitle}>Từ điển Hán ngữ · thuật ngữ Liên Minh Huyền Thoại (Bản Hoa Anh Đào)</p>
      </header>

      <section style={styles.searchCard}>
        <div style={styles.searchRow}>
          <input
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") handleLookup(); }}
            placeholder="Nhập từ tiếng Trung cần tra… ví dụ 打野"
            style={styles.searchInput}
          />
          <button
            onClick={handleLookup}
            disabled={looking || !query.trim()}
            style={{ ...styles.searchBtn, opacity: looking || !query.trim() ? 0.5 : 1 }}
          >
            {looking ? "Đang tra…" : "Tra cứu"}
          </button>
        </div>
        {lookupError && <div style={styles.errorRow}>⚠ <span style={{ color: "#d9534f", fontSize: 13 }}>{lookupError}</span></div>}
      </section>

      <section style={styles.listHeader}>
        <div style={styles.listHeaderLeft}>
          <span style={styles.listCount}>📖 {entries.length} mục từ</span>
        </div>
        <div style={styles.filterRow}>
          <input
            value={filter}
            onChange={(e) => setFilter(e.target.value)}
            placeholder="Lọc trong từ điển…"
            style={styles.filterInput}
          />
          <button style={styles.addBtn} onClick={() => setManualOpen((o) => !o)}>+ Thêm từ</button>
        </div>
      </section>

      {manualOpen && (
        <section style={styles.manualCard}>
          <div style={styles.manualGrid}>
            <input placeholder="Từ (chữ Hán)" value={manualDraft.word} onChange={(e) => setManualDraft({ ...manualDraft, word: e.target.value })} style={styles.manualInput} />
            <input placeholder="Pinyin" value={manualDraft.pinyin} onChange={(e) => setManualDraft({ ...manualDraft, pinyin: e.target.value })} style={styles.manualInput} />
          </div>
          <input placeholder="Nghĩa" value={manualDraft.meaning} onChange={(e) => setManualDraft({ ...manualDraft, meaning: e.target.value })} style={{ ...styles.manualInput, width: "100%", marginTop: 8 }} />
          <textarea placeholder="Ghi chú (không bắt buộc)" value={manualDraft.note} onChange={(e) => setManualDraft({ ...manualDraft, note: e.target.value })} style={{ ...styles.manualInput, width: "100%", marginTop: 8, minHeight: 60, resize: "vertical" }} />
          <select value={manualDraft.category} onChange={(e) => setManualDraft({ ...manualDraft, category: e.target.value })} style={{ ...styles.manualInput, width: "100%", marginTop: 8 }}>
            {CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
          </select>
          <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
            <button style={styles.saveBtn} onClick={addManual} disabled={!manualDraft.word.trim()}>✓ Lưu</button>
            <button style={styles.cancelBtn} onClick={() => setManualOpen(false)}>✕ Huỷ</button>
          </div>
        </section>
      )}

      <main style={styles.list}>
        {!loaded && <div style={styles.emptyState}>Đang tải từ điển…</div>}
        {loaded && entries.length === 0 && (
          <div style={styles.emptyState}>
            Chưa có từ nào. Tra một thuật ngữ LMHT như <span style={{ color: "#d63384" }}>打野</span> (đi rừng) để bắt đầu.
          </div>
        )}
        {loaded && entries.length > 0 && filtered.length === 0 && (
          <div style={styles.emptyState}>Không tìm thấy từ phù hợp với bộ lọc.</div>
        )}
        {grouped.map(({ category, items }) => {
          const isClosed = !!closedFolders[category];
          return (
            <div key={category} style={styles.folder}>
              <div style={styles.folderHeader} onClick={() => toggleFolder(category)}>
                <span style={styles.folderArrow}>{isClosed ? "▶" : "▼"}</span>
                <span style={styles.folderName}>🌸 {category}</span>
                <span style={styles.folderCount}>{items.length}</span>
              </div>
              {!isClosed && (
                <div style={styles.folderBody}>
                  {items.map((entry) => (
                    <div key={entry.id} style={styles.card}>
                      <div style={styles.cardTop}>
                        <div>
                          <span style={styles.word}>{entry.word}</span>
                          <span style={styles.pinyin}>
                            {editingId === entry.id ? (
                              <input value={editDraft.pinyin} onChange={(e) => setEditDraft({ ...editDraft, pinyin: e.target.value })} style={styles.inlineInput} />
                            ) : entry.pinyin}
                          </span>
                        </div>
                        <div style={{ display: "flex", gap: 6 }}>
                          {editingId === entry.id ? (
                            <>
                              <button style={styles.iconBtnGood} onClick={() => saveEdit(entry.id)}>✓</button>
                              <button style={styles.iconBtn} onClick={() => setEditingId(null)}>✕</button>
                            </>
                          ) : (
                            <>
                              <button style={styles.iconBtn} onClick={() => startEdit(entry)}>✎</button>
                              <button style={styles.iconBtnBad} onClick={() => deleteEntry(entry.id)}>🗑</button>
                            </>
                          )}
                        </div>
                      </div>
                      {editingId === entry.id ? (
                        <>
                          <input value={editDraft.meaning} onChange={(e) => setEditDraft({ ...editDraft, meaning: e.target.value })} style={{ ...styles.inlineInput, width: "100%", marginTop: 8, fontSize: 14 }} placeholder="Nghĩa" />
                          <textarea value={editDraft.note} onChange={(e) => setEditDraft({ ...editDraft, note: e.target.value })} style={{ ...styles.inlineInput, width: "100%", marginTop: 6, minHeight: 50, resize: "vertical" }} placeholder="Ghi chú" />
                          <select value={editDraft.category} onChange={(e) => setEditDraft({ ...editDraft, category: e.target.value })} style={{ ...styles.inlineInput, width: "100%", marginTop: 6 }}>
                            {CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
                          </select>
                        </>
                      ) : (
                        <>
                          <p style={styles.meaning}>{entry.meaning}</p>
                          {entry.note && <p style={styles.note}>{entry.note}</p>}
                        </>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </main>

      {toast && <div style={styles.toast}>{toast}</div>}
      {loadError && <div style={styles.toastError}>Có sự cố khi lưu — dữ liệu có thể chưa được cập nhật.</div>}
    </div>
  );
}

const styles = {
  page: { minHeight: "100vh", background: "linear-gradient(135deg, #fff0f5 0%, #ffe4e1 50%, #fdf2f8 100%)", color: "#4a3b4c", fontFamily: "Georgia, 'Noto Serif SC', serif", padding: "28px 16px 60px", position: "relative" },
  header: { maxWidth: 640, margin: "0 auto 22px", textAlign: "center", position: "relative" },
  brandRow: { display: "flex", alignItems: "center", justifyContent: "center", gap: 8 },
  title: { fontSize: 26, fontWeight: 700, letterSpacing: 1, margin: 0, color: "#d63384", textShadow: "0 0 12px rgba(214,51,132,0.15)" },
  subtitle: { fontFamily: "Arial, sans-serif", fontSize: 12.5, color: "#8a6d88", marginTop: 6, letterSpacing: 0.4 },
  searchCard: { maxWidth: 640, margin: "0 auto 18px", background: "rgba(255, 255, 255, 0.85)", backdropFilter: "blur(8px)", border: "1px solid #ffccd5", borderRadius: 8, padding: 14, boxShadow: "0 4px 20px rgba(255, 182, 193, 0.2)" },
  searchRow: { display: "flex", gap: 8 },
  searchInput: { flex: 1, background: "#fff", border: "1px solid #ffb6c1", borderRadius: 4, padding: "11px 12px", color: "#4a3b4c", fontSize: 15, fontFamily: "inherit", outline: "none" },
  searchBtn: { display: "flex", alignItems: "center", gap: 6, background: "linear-gradient(135deg, #ff758c, #ff7eb3)", color: "#fff", border: "none", borderRadius: 4, padding: "0 18px", fontWeight: 700, fontSize: 13.5, fontFamily: "Arial, sans-serif", cursor: "pointer", boxShadow: "0 2px 8px rgba(255, 117, 140, 0.3)" },
  errorRow: { display: "flex", alignItems: "center", gap: 6, marginTop: 8 },
  listHeader: { maxWidth: 640, margin: "0 auto 10px", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 },
  listHeaderLeft: { display: "flex", alignItems: "center", gap: 6 },
  listCount: { fontFamily: "Arial, sans-serif", fontSize: 12.5, color: "#8a6d88", letterSpacing: 0.3 },
  filterRow: { display: "flex", gap: 8 },
  filterInput: { background: "#fff", border: "1px solid #ffb6c1", borderRadius: 4, padding: "7px 10px", color: "#4a3b4c", fontSize: 13, fontFamily: "inherit", outline: "none", width: 160 },
  addBtn: { display: "flex", alignItems: "center", gap: 5, background: "transparent", border: "1px solid #ff758c", color: "#d63384", borderRadius: 4, padding: "7px 12px", fontSize: 12.5, fontFamily: "Arial, sans-serif", fontWeight: 600, cursor: "pointer" },
  manualCard: { maxWidth: 640, margin: "0 auto 16px", background: "rgba(255, 255, 255, 0.9)", border: "1px solid #ff758c", borderRadius: 8, padding: 14, boxShadow: "0 4px 15px rgba(255, 182, 193, 0.25)" },
  manualGrid: { display: "flex", gap: 8 },
  manualInput: { flex: 1, background: "#fff", border: "1px solid #ffb6c1", borderRadius: 4, padding: "9px 10px", color: "#4a3b4c", fontSize: 13.5, fontFamily: "inherit", outline: "none" },
  saveBtn: { display: "flex", alignItems: "center", gap: 5, background: "#ff758c", color: "#fff", border: "none", borderRadius: 4, padding: "7px 14px", fontWeight: 700, fontSize: 12.5, fontFamily: "Arial, sans-serif", cursor: "pointer" },
  cancelBtn: { display: "flex", alignItems: "center", gap: 5, background: "transparent", color: "#8a6d88", border: "1px solid #ffb6c1", borderRadius: 4, padding: "7px 14px", fontSize: 12.5, fontFamily: "Arial, sans-serif", cursor: "pointer" },
  list: { maxWidth: 640, margin: "0 auto", display: "flex", flexDirection: "column", gap: 14 },
  folder: { border: "1px solid #ffccd5", borderRadius: 8, overflow: "hidden", background: "rgba(255, 255, 255, 0.6)", backdropFilter: "blur(5px)" },
  folderHeader: { display: "flex", alignItems: "center", gap: 8, background: "rgba(255, 182, 193, 0.2)", padding: "10px 12px", cursor: "pointer", userSelect: "none" },
  folderArrow: { fontSize: 10, color: "#d63384" },
  folderName: { fontSize: 14, fontWeight: 700, color: "#d63384", flex: 1, fontFamily: "Arial, sans-serif" },
  folderCount: { fontSize: 11.5, color: "#8a6d88", fontFamily: "Arial, sans-serif", background: "rgba(255, 255, 255, 0.8)", padding: "2px 8px", borderRadius: 10 },
  folderBody: { display: "flex", flexDirection: "column", gap: 8, padding: 10 },
  emptyState: { textAlign: "center", color: "#8a6d88", fontSize: 13.5, fontFamily: "Arial, sans-serif", padding: "30px 10px", border: "1px dashed #ffb6c1", borderRadius: 8, background: "rgba(255,255,255,0.4)" },
  card: { background: "rgba(255, 255, 255, 0.85)", border: "1px solid #ffccd5", borderLeft: "3px solid #ff758c", borderRadius: 6, padding: "13px 14px", boxShadow: "0 2px 10px rgba(0,0,0,0.02)" },
  cardTop: { display: "flex", justifyContent: "space-between", alignItems: "flex-start" },
  word: { fontSize: 20, fontWeight: 700, marginRight: 10, color: "#3a2e3b" },
  pinyin: { fontSize: 13.5, color: "#d63384", fontFamily: "Arial, sans-serif" },
  meaning: { margin: "6px 0 2px", fontSize: 14.5, color: "#4a3b4c", lineHeight: 1.5 },
  note: { margin: "4px 0 0", fontSize: 12.5, color: "#8a6d88", fontFamily: "Arial, sans-serif", lineHeight: 1.4, fontStyle: "italic" },
  inlineInput: { background: "#fff", border: "1px solid #ffb6c1", borderRadius: 4, padding: "5px 8px", color: "#4a3b4c", fontSize: 13, fontFamily: "inherit", outline: "none" },
  iconBtn: { background: "transparent", border: "1px solid #ffb6c1", color: "#8a6d88", borderRadius: 4, padding: "6px 9px", cursor: "pointer" },
  iconBtnGood: { background: "#ff758c", border: "none", color: "#fff", borderRadius: 4, padding: "6px 9px", cursor: "pointer" },
  iconBtnBad: { background: "transparent", border: "1px solid #ff6b6b", color: "#d9534f", borderRadius: 4, padding: "6px 9px", cursor: "pointer" },
  toast: { position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)", background: "#ff758c", color: "#fff", padding: "9px 18px", borderRadius: 6, fontSize: 13, fontWeight: 600, fontFamily: "Arial, sans-serif", boxShadow: "0 4px 20px rgba(255, 117, 140, 0.4)" },
  toastError: { position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)", background: "#d9534f", color: "#fff", padding: "9px 18px", borderRadius: 6, fontSize: 13, fontWeight: 600, fontFamily: "Arial, sans-serif" },
};

ReactDOM.createRoot(document.getElementById("root")).render(<LolDictionary />);
</script>
</body>
</html>
